
name: GreenLemon Universal Builder

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'plugins/**/*.zip'
      - '.github/workflows/build.yml'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y maven unzip
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Run Universal Builder
        run: python3 scripts/builder.py

      - name: Upload JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GreenLemon-JARs
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GreenLemon-Reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
          
