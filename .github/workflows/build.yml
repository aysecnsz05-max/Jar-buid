
name: GreenLemon Universal ZIP Builder

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      - name: Maven Setup
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Extract ZIP Files
        run: |
          mkdir -p extracted output
          find . -type f -name "*.zip" \
            -not -path "./extracted/*" \
            -print0 | while IFS= read -r -d '' zip; do
              name=$(basename "$zip" .zip)
              mkdir -p "extracted/$name"
              unzip -oq "$zip" -d "extracted/$name"
            done

      - name: Find and Build Projects
        shell: bash
        run: |
          set +e
          mkdir -p output
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            echo "================================"
            echo "Project: $dir"
            cd "$GITHUB_WORKSPACE/$dir"

            if [[ -f gradlew ]]; then
              chmod +x gradlew
              ./gradlew clean build --no-daemon
            elif [[ -f build.gradle || -f build.gradle.kts ]]; then
              gradle clean build --no-daemon
            elif [[ -f pom.xml ]]; then
              mvn package -DskipTests
            else
              cd "$GITHUB_WORKSPACE"
              continue
            fi

            result=$?
            if [ $result -eq 0 ]; then
              find . -type f -name "*.jar" \
                -not -name "*-sources.jar" \
                -not -name "*-javadoc.jar" \
                -exec cp {} "$GITHUB_WORKSPACE/output/" \;
              echo "BUILD SUCCESS"
            else
              echo "BUILD FAILED: $dir"
            fi

            cd "$GITHUB_WORKSPACE"
          done < <(find extracted -type f \( \
            -name gradlew -o \
            -name build.gradle -o \
            -name build.gradle.kts -o \
            -name pom.xml \
            \) -print0)

      - name: Upload JAR Files
        uses: actions/upload-artifact@v4
        with:
          name: GreenLemon-JARs
          path: output/
          if-no-files-found: warn
          
